name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run brand:check
      - run: npm run build
      # the showcase is generated from the canon; a canon change that breaks it must fail here,
      # not in the image build that deploys ui.messer.wtf
      - run: npm run showcase
      - run: npx playwright install --with-deps chromium
      # marks are generated: regenerate them and fail if the committed assets are stale
      - run: npm run marks && git diff --exit-code -- marks/
      - run: npm run sink
      # every new rule check must be able to fail: the violations fixture proves it
      - run: npm run selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sink-screenshots
          path: |
            screenshots/
            report.json
      - name: registry validate
        if: github.ref == 'refs/heads/main'
        run: npm run validate
