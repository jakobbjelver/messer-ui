name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run brand:check
      - run: npm run build
      # The showcase (ui.messer.wtf) is a private surface and builds in messer-ui-site, which reads
      # this checkout. A canon change that breaks it fails there, not here.
      # The runner image carries Chromium's shared libraries. `--with-deps` runs apt-get, which has
      # twice failed on runner DNS (archive.ubuntu.com) and turned the gate red for infrastructure
      # reasons; the browser download is the only part the measurements need.
      - run: npx playwright install chromium
      # marks are generated: regenerate them and fail if the committed assets are stale.
      # og.png is rasterised and not byte-stable across machines (font hinting), so it is
      # generated but excluded from the diff; the SVGs and icons are hashed and compared.
      - run: npm run marks && git diff --exit-code -- marks/ ':(exclude)marks/*/og.png'
      - run: npm run sink
      # every new rule check must be able to fail: the violations fixture proves it, and the chrome
      # check carries its own fixture suite (a headless page gate needs a served page, its selftest
      # does not)
      - run: npm run chrome:selftest
      # the two generated documents are measured together; their fixture suite runs here, the
      # pages themselves live in private checkouts and run in the nightly
      - run: npm run page:selftest
      - run: npm run selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sink-screenshots
          path: |
            screenshots/
            report.json
      - name: registry validate
        if: github.ref == 'refs/heads/main'
        run: npm run validate
