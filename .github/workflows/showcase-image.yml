name: Showcase image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # arm64 native: emulating the Mac's platform on an x86 runner took >15 min in npm ci
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.showcase
          push: true
          tags: |
            ghcr.io/jakobbjelver/messer-ui-showcase:latest
            ghcr.io/jakobbjelver/messer-ui-showcase:sha-${{ steps.meta.outputs.sha }}
